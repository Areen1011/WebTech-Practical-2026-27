
<!DOCTYPE html>
<html>
<head>
    <title>Registration Form</title>
</head>
<body>

    <h1>Student Registration Form</h1>

    <!-- Step 1: Personal Details -->
    <div id="step1">

        <h2>Personal Details</h2>

        Name:
        <input type="text" id="name"><br><br>

        Email:
        <input type="text" id="email"><br><br>

        Mobile:
        <input type="text" id="mobile"><br><br>

        Password:
        <input type="password" id="password"><br><br>

        Confirm Password:
        <input type="password" id="confirm"><br><br>

        <button onclick="nextStep()">Next</button>

    </div>


    <!-- Step 2: Academic Details -->
    <div id="step2" style="display:none;">

        <h2>Academic Details</h2>

        College Name:
        <input type="text" id="college"><br><br>

        Course:
        <input type="text" id="course"><br><br>

        Roll Number:
        <input type="text" id="roll"><br><br>

        <button onclick="previousStep()">Previous</button>

        <button onclick="submitForm()">Submit</button>

    </div>


    <!-- Final Preview -->
    <div id="preview"></div>


    <script>

        // Step 1 validation
        function nextStep() {

            let name = document.getElementById("name").value;
            let email = document.getElementById("email").value;
            let mobile = document.getElementById("mobile").value;
            let password = document.getElementById("password").value;
            let confirm = document.getElementById("confirm").value;

            // Email validation
            let emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

            // Mobile validation
            let mobilePattern = /^[0-9]{10}$/;

            // Password validation: 8 characters, letter, number and special character
            let passwordPattern = /^(?=.*[A-Za-z])(?=.*[0-9])(?=.*[@#$!%*?&])[A-Za-z0-9@#$!%*?&]{8,}$/;

            if (name === "" || email === "" || mobile === "" ||
                password === "" || confirm === "") {

                alert("Please fill all fields");
                return;
            }

            if (!emailPattern.test(email)) {
                alert("Enter valid email");
                return;
            }

            if (!mobilePattern.test(mobile)) {
                alert("Enter valid 10 digit mobile number");
                return;
            }

            if (!passwordPattern.test(password)) {
                alert("Password must have 8 characters, a letter, a number and a special character");
                return;
            }

            if (password !== confirm) {
                alert("Passwords do not match");
                return;
            }

            // Move to step 2
            document.getElementById("step1").style.display = "none";
            document.getElementById("step2").style.display = "block";
        }


        // Go back to step 1
        function previousStep() {

            document.getElementById("step2").style.display = "none";
            document.getElementById("step1").style.display = "block";
        }


        // Submit registration
        function submitForm() {

            let college = document.getElementById("college").value;
            let course = document.getElementById("course").value;
            let roll = document.getElementById("roll").value;

            if (college === "" || course === "" || roll === "") {
                alert("Please fill all academic details");
                return;
            }

            // Display submitted information
            let html = `
                <h2>Registration Successful!</h2>

                <h3>Personal Details</h3>

                Name: ${document.getElementById("name").value}<br><br>

                Email: ${document.getElementById("email").value}<br><br>

                Mobile: ${document.getElementById("mobile").value}<br><br>

                <h3>Academic Details</h3>

                College: ${college}<br><br>

                Course: ${course}<br><br>

                Roll Number: ${roll}
            `;

            document.getElementById("step1").style.display = "none";
            document.getElementById("step2").style.display = "none";

            document.getElementById("preview").innerHTML = html;
        }

    </script>

</body>
</html>
