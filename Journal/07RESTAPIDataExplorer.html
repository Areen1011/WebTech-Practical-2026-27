
<!DOCTYPE html>
<html>
<head>
    <title>REST API Data Explorer</title>
</head>
<body>

    <h1>REST API Data Explorer</h1>

    <button onclick="fetchData()">Refresh Data</button>

    <br><br>

    <input type="text" id="search" placeholder="Search posts..." oninput="searchData()">

    <select id="sort" onchange="sortData()">
        <option value="">Sort By</option>
        <option value="asc">ID Low to High</option>
        <option value="desc">ID High to Low</option>
    </select>

    <p id="loading"></p>
    <p id="error"></p>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>ID</th>
                <th>User ID</th>
                <th>Title</th>
                <th>Body</th>
            </tr>
        </thead>

        <tbody id="tableData"></tbody>
    </table>

    <br>

    <button onclick="previousPage()">Previous</button>
    <span id="page"></span>
    <button onclick="nextPage()">Next</button>

    <script>

        let posts = [];
        let filteredPosts = [];
        let currentPage = 1;
        let limit = 10;

        async function fetchData() {

            document.getElementById("loading").innerHTML = "Loading data...";
            document.getElementById("error").innerHTML = "";

            try {

                let response = await fetch("https://jsonplaceholder.typicode.com/posts");

                if (!response.ok) {
                    throw new Error("Failed to fetch data");
                }

                posts = await response.json();

                filteredPosts = posts;
                currentPage = 1;

                displayData();

                document.getElementById("loading").innerHTML = "";

            }
            catch (error) {

                document.getElementById("error").innerHTML = error.message;
                document.getElementById("loading").innerHTML = "";

            }
        }

        function displayData() {

            let start = (currentPage - 1) * limit;
            let end = start + limit;

            let data = filteredPosts.slice(start, end);

            let html = "";

            for (let post of data) {

                html += `
                    <tr>
                        <td>${post.id}</td>
                        <td>${post.userId}</td>
                        <td>${post.title}</td>
                        <td>${post.body}</td>
                    </tr>
                `;
            }

            document.getElementById("tableData").innerHTML =
                html || "<tr><td colspan='4'>No data found</td></tr>";

            let totalPages = Math.ceil(filteredPosts.length / limit);

            document.getElementById("page").innerHTML =
                "Page " + currentPage + " of " + totalPages;
        }

        function searchData() {

            let value = document.getElementById("search").value.toLowerCase();

            filteredPosts = posts.filter(post => {

                return post.title.toLowerCase().includes(value) ||
                       post.body.toLowerCase().includes(value);

            });

            currentPage = 1;
            displayData();
        }

        function sortData() {

            let value = document.getElementById("sort").value;

            if (value === "asc") {
                filteredPosts.sort((a, b) => a.id - b.id);
            }
            else if (value === "desc") {
                filteredPosts.sort((a, b) => b.id - a.id);
            }

            currentPage = 1;
            displayData();
        }

        function nextPage() {

            let totalPages = Math.ceil(filteredPosts.length / limit);

            if (currentPage < totalPages) {
                currentPage++;
                displayData();
            }
        }

        function previousPage() {

            if (currentPage > 1) {
                currentPage--;
                displayData();
            }
        }

        fetchData();

    </script>

</body>
</html>
