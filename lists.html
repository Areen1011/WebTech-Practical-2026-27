<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lists</title>
</head>
<body>
    <h3>Subjects list</h3>
    <ol type="1" start="5">
        <li>Java</li>
        <li>HTML</li>
        <li>CSS</li>
        <li>PYTHON</li>
    </ol>
    <ul type="circle">
        <li>Java</li>
        <li>HTML</li>
        <li>CSS</li>
        <li>PYTHON</li>        
    </ul>
    <ol reversed>
        <li>Java</li>
        <li>HTML</li>
        <li>CSS</li>
        <li>PYTHON</li>
    </ol>
    <dl>
        <dt>HTML:</dt>
        <dd>HyperText Markup Language, the standard language for creating web pages.</dd>
        <dt>CSS:</dt>
        <dd>Cascading Style Sheets, used to style the visual presentation of a page.</dd>
    </dl>


</body>
</html>
