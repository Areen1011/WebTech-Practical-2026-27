<!DOCTYPE html>
<html>
<head>
    <title>Mouse Events</title>

    <style>
        body {
            font-family: Arial;
            text-align: center;
        }

        button {
            padding: 15px;
            margin: 10px;
            background-color: lightblue;
            cursor: pointer;
        }

        #box {
            background-color: lightgreen;
            padding: 30px;
            margin: 20px;
        }
    </style>
</head>

<body>

    <h2>JavaScript Mouse Events</h2>

    <button onclick="showClick()">Click Me</button>
    <button ondblclick="showDoubleClick()">Double Click Me</button>
    <button onmouseup="showMouseUp()">Release Mouse Button</button>

    <div id="box" onmouseover="showMouseOver()">
        Move Mouse Over This Box
    </div>

    <p id="result">Event result will appear here.</p>

    <script>
        function showClick() {
            document.getElementById("result").innerHTML =
                "onclick event occurred!";
        }

        function showDoubleClick() {
            document.getElementById("result").innerHTML =
                "dblclick event occurred!";
        }

        function showMouseUp() {
            document.getElementById("result").innerHTML =
                "mouseup event occurred!";
        }

        function showMouseOver() {
            document.getElementById("result").innerHTML =
                "mouseover event occurred!";
        }
    </script>

</body>
</html>
