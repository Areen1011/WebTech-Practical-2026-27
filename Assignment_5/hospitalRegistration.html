<!DOCTYPE html>
<html>
<head>
    <title>Hospital Registration Form</title>

    <style>
        body {
            font-family: Arial;
            background-color: lightblue;
        }

        form {
            background-color: white;
            width: 400px;
            margin: 30px auto;
            padding: 20px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
            color: darkblue;
        }

        input, select, textarea {
            width: 95%;
            padding: 8px;
            margin: 8px 0;
        }

        button {
            background-color: green;
            color: white;
            padding: 10px;
            border: none;
            cursor: pointer;
        }
    </style>
</head>

<body>

<form id="hospitalForm">
    <h2>Hospital Registration</h2>

    <label>Patient Name:</label>
    <input type="text" id="name" required>

    <label>Age:</label>
    <input type="number" id="age" min="0" max="120" required>

    <label>Gender:</label>
    <select id="gender" required>
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
    </select>

    <label>Contact Number:</label>
    <input type="tel" id="phone" pattern="[0-9]{10}" 
           placeholder="10-digit number" required>

    <label>Email:</label>
    <input type="email" id="email" required>

    <label>Department:</label>
    <select id="department" required>
        <option value="">Select Department</option>
        <option>General Medicine</option>
        <option>Cardiology</option>
        <option>Orthopedics</option>
        <option>Dermatology</option>
        <option>Pediatrics</option>
    </select>

    <label>Address:</label>
    <textarea id="address" required></textarea>

    <button type="submit">Register Patient</button>
    <button type="reset">Reset</button>

    <p id="message"></p>
</form>

<script>
    document.getElementById("hospitalForm").onsubmit = function(event) {
        event.preventDefault();

        let name = document.getElementById("name").value;
        let age = Number(document.getElementById("age").value);

        if (age < 0 || age > 120) {
            document.getElementById("message").innerHTML =
                "Please enter a valid age.";
            document.getElementById("message").style.color = "red";
        } else {
            document.getElementById("message").innerHTML =
                "Patient " + name + " registered successfully!";
            document.getElementById("message").style.color = "green";
        }
    };
</script>

</body>
</html>
