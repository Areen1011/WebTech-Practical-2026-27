<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- There are two types of list - Ordered list, Unordered list -->
    <ol>
        <li>Apple</li>
        <li>Banana</li>
        <li>Grape</li>
        <li>Watermelon</li>
    </ol>

    <ul>
        <li>Apple</li>
        <li>Banana</li>
        <li>Grape</li>
        <li>Watermelon</li>
    </ul>

    <!-- You can specify the type of a list of both ordered and unordered -->
    <ol type="1">
        <li>Apple</li>
    </ol>
    <ol type="A">
        <li>Apple</li>
    </ol>
    <ol type="a">
        <li>Apple</li>
    </ol>
    <ol type="I">
        <li>Apple</li>
    </ol>
    <ol type="i">
        <li>Apple</li>
    </ol>

</body>
</html>
